name: Revamp photo builder

on:
  push:
    branches:
      - revamp/part-b-visual-content-v2

permissions:
  contents: write

jobs:
  photos:
    if: github.event.head_commit.message != 'chore: generate curated revamp photos [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/part-b-visual-content-v2
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/revamp-images.mjs

      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images content/images.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: generate curated revamp photos [skip ci]"
          git push origin HEAD:revamp/part-b-visual-content-v2
