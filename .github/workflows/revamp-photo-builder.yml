name: Revamp photo builder

on:
  workflow_dispatch:
  push:
    branches:
      - repair/image-integrity-20261008

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/revamp-images.mjs
      - run: node scripts/check-images.mjs

      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images content/images.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: generate curated revamp photos [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
