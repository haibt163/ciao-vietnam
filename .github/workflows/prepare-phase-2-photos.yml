name: Prepare Phase 2 photo replacements

on:
  push:
    branches:
      - phase-2a-photos-selected

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch, validate and prepare selected photos
        env:
          PHOTO_OUTPUT: public/images
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const sharp = require('sharp');

          const outputDir = process.env.PHOTO_OUTPUT;

          const selections = {
            'hoan-kiem': {
              photographer: 'Hồng Quang Official',
              page: 'https://www.pexels.com/photo/turtle-tower-in-hoan-kiem-lake-hanoi-vietnam-33740950/',
              url: 'https://images.pexels.com/photos/33740950/pexels-photo-33740950.jpeg',
              hero: true,
              focus: '50% 50%',
            },
            bentre: {
              photographer: 'Yang Thanh',
              page: 'https://www.pexels.com/photo/view-of-people-getting-into-a-rowboat-for-a-mekong-delta-boat-ride-in-vietnam-18903675/',
              url: 'https://images.pexels.com/photos/18903675/pexels-photo-18903675.jpeg',
              hero: true,
              focus: '50% 45%',
            },
            muine: {
              photographer: 'Quang Nguyen Vinh',
              page: 'https://www.pexels.com/photo/palm-trees-and-stacked-boats-8259999/',
              url: 'https://images.pexels.com/photos/8259999/pexels-photo-8259999.jpeg',
              hero: true,
              focus: '50% 48%',
            },
            cattien: {
              photographer: 'Thien Nhan',
              page: 'https://www.pexels.com/photo/exploring-roots-in-nam-cat-tien-forest-37006081/',
              url: 'https://images.pexels.com/photos/37006081/pexels-photo-37006081.jpeg',
              hero: false,
            },
            chaudoc: {
              photographer: 'HONG SON',
              page: 'https://www.pexels.com/photo/ancient-city-gate-surrounded-by-lush-trees-39944748/',
              url: 'https://images.pexels.com/photos/39944748/pexels-photo-39944748.jpeg',
              hero: false,
            },
            cuchi: {
              photographer: 'manvinder social',
              page: 'https://www.pexels.com/photo/cu-chi-tunnels-entrance-in-ho-chi-minh-city-31832778/',
              url: 'https://images.pexels.com/photos/31832778/pexels-photo-31832778.jpeg',
              hero: false,
            },
            french: {
              photographer: 'Q. Hưng Phạm',
              page: 'https://www.pexels.com/photo/colonial-architecture-in-hanoi-vietnam-28998626/',
              url: 'https://images.pexels.com/photos/28998626/pexels-photo-28998626.jpeg',
              hero: false,
            },
            hagiang: {
              photographer: 'TUAN PHAN',
              page: 'https://www.pexels.com/photo/scenic-landscape-of-ha-giang-mountains-vietnam-34574527/',
              url: 'https://images.pexels.com/photos/34574527/pexels-photo-34574527.jpeg',
              hero: false,
            },
            haivan: {
              photographer: 'Nhà văn',
              page: 'https://www.pexels.com/photo/scenic-view-of-hai-van-pass-35211010/',
              url: 'https://images.pexels.com/photos/35211010/pexels-photo-35211010.jpeg',
              hero: false,
            },
            'khai-dinh': {
              photographer: 'Dương Nhân',
              page: 'https://www.pexels.com/photo/entrance-of-khai-dinh-tomb-18509403/',
              url: 'https://images.pexels.com/photos/18509403/pexels-photo-18509403.jpeg',
              hero: false,
            },
            'japan-bridge': {
              photographer: 'Fernando B M',
              page: 'https://www.pexels.com/photo/japanese-covered-bridge-in-hoi-an-vietnam-29781428/',
              url: 'https://images.pexels.com/photos/29781428/pexels-photo-29781428.jpeg',
              hero: false,
            },
          };

          const imageData = JSON.parse(fs.readFileSync('content/images.json', 'utf8'));

          function parseFocus(focus) {
            const [x = '50%', y = '50%'] = String(focus).trim().split(/\s+/);
            const n = (v) => String(v).endsWith('%') ? Number.parseFloat(v) / 100 : Number.parseFloat(v);
            return [n(x), n(y)];
          }

          function cropBox(width, height, ratio, focus) {
            let cropW;
            let cropH;
            if (width / height > ratio) {
              cropH = height;
              cropW = Math.round(height * ratio);
            } else {
              cropW = width;
              cropH = Math.round(width / ratio);
            }
            const [fx, fy] = parseFocus(focus);
            let left = Math.round(fx * width - cropW / 2);
            let top = Math.round(fy * height - cropH / 2);
            left = Math.max(0, Math.min(left, width - cropW));
            top = Math.max(0, Math.min(top, height - cropH));
            const objectX = ((fx * width) - left) / cropW;
            const objectY = ((fy * height) - top) / cropH;
            return {
              left, top, cropW, cropH,
              focus: `${Math.round(Math.max(0, Math.min(1, objectX)) * 100)}% ${Math.round(Math.max(0, Math.min(1, objectY)) * 100)}%`,
            };
          }

          async function fetchBuffer(url) {
            const response = await fetch(url, {
              headers: { 'User-Agent': 'ciao-vietnam-photo-preparer' },
              redirect: 'follow',
            });
            if (!response.ok) throw new Error(`${response.status} ${response.statusText} for ${url}`);
            return Buffer.from(await response.arrayBuffer());
          }

          async function removeVariants(id) {
            for (const name of fs.readdirSync(outputDir)) {
              if (name.startsWith(`${id}-`) && name.endsWith('.webp')) {
                fs.unlinkSync(path.join(outputDir, name));
              }
            }
          }

          async function writeVariant(buffer, id, width, quality) {
            const out = await sharp(buffer)
              .resize({ width, withoutEnlargement: true })
              .webp({ quality, effort: 4 })
              .toBuffer();
            const meta = await sharp(out).metadata();
            if (!meta.width || !meta.height) throw new Error(`No dimensions for ${id}-${width}.webp`);
            fs.writeFileSync(path.join(outputDir, `${id}-${width}.webp`), out);
            return { width: meta.width, height: meta.height, bytes: out.length };
          }

          fs.mkdirSync(outputDir, { recursive: true });

          (async () => {
            for (const [id, selection] of Object.entries(selections)) {
              const buffer = await fetchBuffer(selection.url);
              const meta = await sharp(buffer).metadata();
              if (!meta.width || !meta.height) throw new Error(`${id}: source has no dimensions`);
              const longEdge = Math.max(meta.width, meta.height);
              console.log(`${id}: source ${meta.width}x${meta.height}`);
              if (longEdge < 3000) throw new Error(`${id}: source is below 3000 px long edge`);

              await removeVariants(id);

              let prepared = buffer;
              let focus;
              let heroLayout;

              if (selection.hero) {
                const frame = cropBox(meta.width, meta.height, 4 / 5, selection.focus);
                if (frame.cropW < 960) {
                  heroLayout = 'landscape';
                } else {
                  prepared = await sharp(buffer)
                    .extract({ left: frame.left, top: frame.top, width: frame.cropW, height: frame.cropH })
                    .toBuffer();
                  focus = frame.focus;
                  heroLayout = 'portrait';
                }
              }

              const widths = selection.hero ? [640, 960, 1280] : [640, 960];
              const made = [];
              for (const width of widths) {
                const item = await writeVariant(prepared, id, width, 78);
                if (item.width < width) console.log(`${id}: no upscale; wrote ${item.width} instead of ${width}`);
                made.push(item);
              }

              const largest = made[made.length - 1];
              const srcItem = made.find((x) => x.width === 960) || largest;
              const existing = imageData[id];
              if (!existing) throw new Error(`${id}: missing content/images.json entry`);

              imageData[id] = {
                ...existing,
                src: `/images/${id}-${srcItem.width}.webp`,
                srcSet: made.map((x) => `/images/${id}-${x.width}.webp ${x.width}w`).join(', '),
                width: largest.width,
                height: largest.height,
                credit: selection.photographer,
                license: 'Pexels License',
                licenseUrl: 'https://www.pexels.com/license/',
                source: selection.page,
                cropped: Boolean(selection.hero),
                ...(selection.hero ? { focus, heroLayout } : {}),
              };
              console.log(`${id}: wrote ${made.map((x) => `${x.width}px/${x.bytes}B`).join(' ')}`);
            }

            fs.writeFileSync('content/images.json', JSON.stringify(imageData, null, 2) + '\n');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Check image budget
        run: |
          bytes=$(find public/images -type f -name '*.webp' -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')
          mb=$(awk "BEGIN {printf \"%.1f\", $bytes / 1024 / 1024}")
          echo "public/images = $mb MB"
          test "$bytes" -le $((40 * 1024 * 1024))

      - name: Verify metadata and application
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit prepared photos
        env:
          BRANCH: phase-2a-photos-selected
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images content/images.json
          git rm .github/workflows/prepare-phase-2-photos.yml
          git diff --cached --quiet && { echo "No generated changes."; exit 1; }
          git commit -m "feat: replace weak Phase 2 travel photos"
          git push origin "HEAD:$BRANCH"
